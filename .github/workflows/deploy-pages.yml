name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-pages.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The root package.json declares client/server workspaces; the server
      # install is irrelevant here but `npm ci` needs the whole lockfile tree.
      - name: Install dependencies
        run: npm ci

      # Pages serves this project at /<repo>/, so assets need that prefix.
      # Passing it here keeps the build correct if the repo is ever renamed;
      # vite.landing.config.ts falls back to '/dr-zaid-homeocare/' when unset.
      # The value must start and end with a slash.
      - name: Build landing page
        run: npm run build:landing
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Verify asset paths are prefixed for the Pages subpath
        run: |
          grep -q 'src="/${{ github.event.repository.name }}/assets/' client/dist-landing/index.html
          test -f client/dist-landing/.nojekyll
          echo "Landing bundle looks correct."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist-landing

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
