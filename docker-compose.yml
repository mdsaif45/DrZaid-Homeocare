version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: homeocare-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: homeocare_db
      POSTGRES_USER: homeocare_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - homeocare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeocare_user -d homeocare_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: homeocare-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: homeocare_db
      DB_USER: homeocare_user
      DB_PASSWORD: ${DB_PASSWORD:-your_secure_password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - "3000:3000"
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/logs:/app/logs
    networks:
      - homeocare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (React)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: homeocare-client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - homeocare-network
    environment:
      VITE_API_URL: ${API_URL:-http://localhost:3000}

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: homeocare-nginx
    restart: unless-stopped
    depends_on:
      - api
      - client
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - homeocare-network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local

networks:
  homeocare-network:
    driver: bridge
